name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable

      - name: Flutter analyze + test
        run: |
          cd ui/flutter
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

  daemon-check:
    name: Daemon host test + Android cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Daemon host tests
        run: cargo test --locked -p peridot-essential-daemon

      - name: Android NDK
        run: |
          set -euo pipefail
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" >/dev/null

      # host-rust links against the custom embedder engine, which is built
      # from source in peridot-release.yml. Here we verify the daemon alone
      # (no embedder dependency) cross-compiles for Android.
      - name: Daemon Android cross-compile check
        run: |
          NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -1)
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          cargo build --release --target aarch64-linux-android -p peridot-essential-daemon

[package]
name = "peridot-essential-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# Only the two declared Peridot executables are build targets.
autobins = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "peridot_essential_backend"
path = "src/lib.rs"

[[bin]]
name = "peridot_daemon"
path = "src/bin/peridot_daemon.rs"

[[bin]]
name = "peridot_ctl"
path = "src/bin/peridot_ctl.rs"
